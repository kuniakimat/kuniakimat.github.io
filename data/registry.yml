  kind: story
  url: /apps/sons_fable/
  legacy_url: https://kuniakimat.github.io/sons_fable/
  repo: kuniakimat/sons_fable
  concepts: [恩源, 恩源継承, 知恩]
  summary: 恩源を「森を保つ亀爺さん」、受益者を「サル」として描く全十話の寓話
  related: [app-sons, story-kinomi]
  status: public

story-kinomi:
  title: 木の実をひとつ
  kind: story
  url: /apps/kinomi/
  legacy_url: https://kuniakimat.github.io/kinomi/
  repo: kuniakimat/kinomi
  concepts: [恩源, 恩源継承]
  summary: タップして読む短い導入面
  related: [story-sons-fable]
