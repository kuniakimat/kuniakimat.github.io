story-pyramid-of-life:
  title: Pyramid of Life
  kind: story
  url: /apps/sons_story/
  legacy_url: https://kuniakimat.github.io/sons_story/
  repo: kuniakimat/sons_story
  concepts: [SONS, 恩源, 人生基盤]
  summary: 恩源のピラミッドを一人の50年の人生として導入する私小説形式の実験
